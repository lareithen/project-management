name: Feature
description: Implement a new feature.
title: "feat: <description>"
labels: [feature]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: A short description of the feature.
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Solution
      description: Describe the implementation approach.
    validations:
      required: false
  - type: textarea
    id: extrainfo
    attributes:
      label: Additional Information
      description: Provide any additional details, such as links, screenshots, etc.
    validations:
      required: false
