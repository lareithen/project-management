name: Chore
description: General maintenance tasks and project improvements.
title: "chore: <description>"
labels: [chore]
body:
  - type: textarea
    id: task
    attributes:
      label: Task
      description: Describe the maintenance task.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is it needed?
    validations:
      required: false
  - type: textarea
    id: extrainfo
    attributes:
      label: Additional Information
      description: Provide any additional details, such as links, screenshots, etc.
    validations:
      required: false
