name: Refactor
description: Improve existing code without changing behavior.
title: "refactor: <description>"
labels: [refactor]
body:
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What should be refactored?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Reason
      description: Why is this refactor needed?
    validations:
      required: false
  - type: textarea
    id: extrainfo
    attributes:
      label: Additional Information
      description: Provide any additional details, such as links, screenshots, etc.
    validations:
      required: false
